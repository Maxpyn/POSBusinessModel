services:
  - type: web
    name: pos-business-model
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pos-business-model-db
          property: connectionString

databases:
  - name: pos-business-model-db
    plan: free